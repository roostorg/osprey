[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "example_plugins"
version = "0.1.0"
description = "Example plugins for Osprey"
requires-python = ">=3.11"
dependencies = [
    "pluggy==1.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
# The entry points name these top-level modules, which package discovery skips.
py-modules = ["register_plugins", "register_async_plugins"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]

[project.entry-points.osprey_plugin]
register_plugins = "register_plugins"

[project.entry-points.osprey_async_plugin]
register_async_plugins = "register_async_plugins"
