[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osprey-rpc"
version = "0.1.0"
description = "RPC/protobuf pythong bindings for Osprey"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.82.1",
    "protobuf>=7.35,<8",
]
