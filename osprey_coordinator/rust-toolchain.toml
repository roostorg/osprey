# Rust toolchain for osprey_coordinator. rustup uses it for local builds and
# CI's rust-quality job reads `channel` from here, so both use the same
# compiler. Bump it in its own PR, together with the `FROM rust:` version in
# osprey_coordinator/Dockerfile.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
