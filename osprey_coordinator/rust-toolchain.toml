# Rust toolchain for osprey_coordinator. rustup uses it for local builds and
# CI's rust-quality job reads `channel` from here, so both use the same
# compiler.
#
# Keep `channel` equal to the rust:<version> tag in osprey_coordinator/Dockerfile;
# bump both together, in their own PR.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
