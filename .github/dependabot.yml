version: 2
# One PR bumps osprey_coordinator/rust-toolchain.toml and the coordinator
# Dockerfile's FROM images together; they must stay on the same Rust version.
multi-ecosystem-groups:
  coordinator-rust:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"
    ignore:
      - dependency-name: "grpcio"

  - package-ecosystem: "npm"
    directory: "/osprey_ui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/osprey_coordinator"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/osprey_ui"
      - "/osprey_async_worker"
      - "/osprey_worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # No security-updates group: Dependabot doesn't support security updates for
    # Docker, so base images only move through the weekly version updates.

  # Coordinator image and toolchain pin: see multi-ecosystem-groups above. The
  # group's schedule applies; cooldown and labels stay per ecosystem.
  - package-ecosystem: "docker"
    directory: "/osprey_coordinator"
    patterns: ["*"]
    multi-ecosystem-group: "coordinator-rust"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"

  - package-ecosystem: "rust-toolchain"
    directory: "/osprey_coordinator"
    patterns: ["rust-toolchain"]
    multi-ecosystem-group: "coordinator-rust"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dependabot"
