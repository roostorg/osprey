name: Pipeline supply-chain analysis

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.poutine.yml'
  pull_request:
    branches: ['**']
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.poutine.yml'
  schedule:
    # Weekly drift check: new poutine rules / advisories can flag workflows
    # that were clean when they were last touched.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: poutine-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  poutine:
    name: Run poutine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload SARIF results to code scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to main@badd750a rather than the v1.1.4 tag: the latest tag
      # still ships poutine 1.1.4, while this commit ships 1.1.6. Bump
      # deliberately when upstream cuts a tag for it.
      - name: poutine - GitHub Actions SAST (human-readable)
        uses: boostsecurityio/poutine-action@badd750a259150be3b8b00823ad60849d539b96d # main @ poutine 1.1.6
        with:
          format: pretty
          output: poutine.txt

      - name: poutine - GitHub Actions SAST (SARIF)
        uses: boostsecurityio/poutine-action@badd750a259150be3b8b00823ad60849d539b96d # main @ poutine 1.1.6
        with:
          format: sarif
          output: poutine.sarif

      # The action always exits 0, so gate here. Notes (e.g. actions from
      # unverified creators) are reported to code scanning but do not fail
      # CI; warnings and errors do.
      - name: Report and gate on findings
        env:
          FAIL_LEVEL_REGEX: '^(warning|error)$'
        run: |
          {
            echo '## poutine'
            echo '```'
            cat poutine.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

          blocking="$(jq --arg re "$FAIL_LEVEL_REGEX" \
            '[.runs[0].results[]? | select((.level // "warning") | test($re))] | length' \
            poutine.sarif)"

          if [ "$blocking" -gt 0 ]; then
            echo "::error::poutine found ${blocking} finding(s) at warning level or above"
            exit 1
          fi
          echo "poutine: no findings at warning level or above"

      - name: Upload SARIF to code scanning
        # Only on push/schedule: PRs from forks cannot push SARIF results, so
        # findings surface in the job summary above instead.
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: poutine.sarif
          category: poutine

      - name: Upload poutine reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: poutine-reports
          path: |
            poutine.sarif
            poutine.txt
          if-no-files-found: warn
