# Blocks merging while a PR carries a "do not merge" marker.
# See docs/development/blocking-merges.md.
#
# Branch protection refers to the `nocommit` check by name; keep the job name stable.
#
# The code scan skips two files that have to contain the marker: this workflow and
# docs/development/blocking-merges.md, the page that documents the convention.
name: nocommit

on:
  pull_request:
    # `edited` re-runs the check when the title or description changes;
    # `labeled`/`unlabeled` when the do-not-merge label is added or removed.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: nocommit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nocommit:
    name: nocommit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for do-not-merge markers
        env:
          # PR-controlled text goes through env only, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'do-not-merge') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          marker='nocommit|do not merge'
          failed=0

          # 1. Added lines in the PR diff. Removed and unchanged lines are ignored.
          #    -U0 gives no context lines; the awk tracks file headers vs. hunk bodies
          #    so an added line that itself starts with "++" is still scanned.
          hits=$(git -c core.quotePath=false diff --no-color --no-ext-diff -U0 \
              "origin/${BASE_REF}...HEAD" -- . \
              ':(exclude,top).github/workflows/nocommit.yml' \
              ':(exclude,top)docs/development/blocking-merges.md' \
            | awk -v re="$marker" '
                function prop(s) { gsub(/%/, "%25", s); gsub(/\r/, "%0D", s); gsub(/:/, "%3A", s); gsub(/,/, "%2C", s); return s }
                function msg(s)  { gsub(/%/, "%25", s); gsub(/\r/, "%0D", s); return s }
                /^diff --git / { in_hunk = 0; file = ""; next }
                !in_hunk && /^\+\+\+ / { file = substr($0, 5); sub(/^b\//, "", file); next }
                /^@@ / {
                  in_hunk = 1
                  split($3, a, ","); line = substr(a[1], 2) + 0
                  next
                }
                in_hunk && /^\+/ {
                  text = substr($0, 2)
                  if (tolower(text) ~ re) {
                    printf "::error file=%s,line=%d,title=nocommit (added code)::%s:%d adds a do-not-merge marker: %s\n", prop(file), line, msg(file), line, msg(substr(text, 1, 200))
                  }
                  line++
                }
              ')
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            failed=1
          fi

          # 2. PR title and description. Here-strings, not `printf | grep -q`: with pipefail,
          #    grep exiting on an early match can SIGPIPE printf on a long body and hide the hit.
          if grep -qiE "$marker" <<< "$PR_TITLE"; then
            echo "::error title=nocommit (PR title)::The PR title contains a do-not-merge marker (nocommit / do not merge)."
            failed=1
          fi
          if grep -qiE "$marker" <<< "$PR_BODY"; then
            echo "::error title=nocommit (PR description)::The PR description contains a do-not-merge marker (nocommit / do not merge)."
            failed=1
          fi

          # 3. do-not-merge label.
          if [ "$HAS_LABEL" = "true" ]; then
            echo "::error title=nocommit (label)::The PR has the do-not-merge label."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "No do-not-merge markers found."
