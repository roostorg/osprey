name: E2E Smoke Test

# End-to-end smoke test of the demo stack: ingest an example_data event, assert an
# example_rules rule fires, and query the result over the UI API. Run locally with
# ./e2e-smoke.sh (see AGENTS.md). Required green on the release commit; see
# docs/development/releases.md.
on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Only run the (heavy) E2E job on PRs when something that can affect the running
  # app changed. Releases and manual runs always run it.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            app:
              - 'osprey_worker/**'
              - 'osprey_rpc/**'
              - 'proto/**'
              - 'example_rules/**'
              - 'example_data/**'
              - 'druid/**'
              - 'docker-compose.yaml'
              - 'e2e-smoke.sh'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/e2e.yml'

  e2e:
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Run smoke test
        run: ./e2e-smoke.sh

      - name: Collect stack logs
        if: ${{ failure() }}
        run: |
          mkdir -p e2e-logs
          docker compose ps --all > e2e-logs/ps.txt
          docker compose logs --no-color > e2e-logs/compose.log

      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 14
