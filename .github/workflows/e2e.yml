name: E2E Smoke Test

# End-to-end smoke test of the demo stack: ingest an example_data event, assert an
# example_rules rule fires, and query the result over the UI API. Run locally with
# ./e2e-smoke.sh (see AGENTS.md). Required green on the release commit; see
# docs/development/releases.md.
on:
  # Any base branch, so stacked PRs (based on another PR's branch) get the check too.
  # PRs only run it when something that can affect the running app changed.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'osprey_worker/**'
      - 'osprey_rpc/**'
      - 'osprey_async_worker/**'
      - 'example_plugins/**'
      - 'example_atproto_plugins/**'
      - 'example_atproto_rules/**'
      - 'proto/**'
      - 'example_rules/**'
      - 'example_data/**'
      - 'druid/**'
      - 'docker-compose.yaml'
      - '.dockerignore'
      - 'entrypoint.sh'
      - 'init-minio-bucket.sh'
      - 'e2e-smoke.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/e2e.yml'
  # Every commit on main and release branches, unfiltered, so any release commit
  # (including one that only touches CHANGELOG.md) already has a run to check.
  push:
    branches: [main, 'release/**']
  release:
    types: [published]
  workflow_dispatch:

# PRs: one run per branch, newest wins. Everything else: one group per commit, so a quick
# succession of merges doesn't cancel the pending run of an earlier (possibly release) commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Run smoke test
        run: ./e2e-smoke.sh

      - name: Collect stack logs
        if: ${{ failure() || cancelled() }}
        run: |
          mkdir -p e2e-logs
          docker compose ps --all > e2e-logs/ps.txt
          docker compose logs --no-color > e2e-logs/compose.log

      - name: Upload logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 14
