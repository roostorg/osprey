name: Dependency Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Check dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # for comment-summary-in-pr
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Surfaces every finding, whatever its severity, as a warning and in the PR
      # comment. Never fails; the next step enforces the severity threshold.
      - name: Dependency review (warnings)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          warn-only: true
          # Licenses are checked by the license-check-* workflows.
          license-check: false
          comment-summary-in-pr: always

      # Fails on high or critical findings and replaces the comment above with
      # the failure summary.
      - name: Dependency review (enforce)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: on-failure
