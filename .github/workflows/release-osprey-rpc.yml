name: Release osprey-rpc

on:
  release:
    types: [published]

env:
  # Fall back to GHCR if the default mirror.gcr.io Trivy DB mirror is unavailable.
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

jobs:
  build-osprey-rpc:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "latest"
          enable-cache: false

      - name: Build osprey-rpc sdist
        working-directory: osprey_rpc
        run: uv build --sdist --out-dir dist

      - name: Create zip from sdist
        working-directory: osprey_rpc/dist
        run: |
          tar -xzf osprey_rpc-*.tar.gz
          SDIST_DIR=$(ls -d osprey_rpc-*/)
          SDIST_DIR=${SDIST_DIR%/}
          zip -r "${SDIST_DIR}.zip" "${SDIST_DIR}"
          rm -rf "${SDIST_DIR}"
          ls -la

      - name: Install Trivy
        uses: ./.github/actions/install-trivy

      # CycloneDX SBOM of osprey-rpc plus the dependency versions locked in
      # uv.lock, generated from a throwaway venv with the sdist installed.
      - name: Generate osprey-rpc SBOM
        run: |
          uv export --package osprey-rpc --no-dev --frozen --no-emit-workspace \
            --no-hashes --format requirements-txt > "$RUNNER_TEMP/osprey-rpc-requirements.txt"
          uv venv "$RUNNER_TEMP/osprey-rpc-sbom"
          sdist=$(ls osprey_rpc/dist/osprey_rpc-*.tar.gz)
          uv pip install --python "$RUNNER_TEMP/osprey-rpc-sbom/bin/python" --no-deps \
            "$sdist" -r "$RUNNER_TEMP/osprey-rpc-requirements.txt"
          "$RUNNER_TEMP/trivy-bin/trivy" rootfs --quiet --format cyclonedx \
            --output "osprey_rpc/dist/$(basename "$sdist" .tar.gz).cdx.json" \
            "$RUNNER_TEMP/osprey-rpc-sbom"

      - name: Upload osprey-rpc to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            osprey_rpc/dist/osprey_rpc-*.tar.gz \
            osprey_rpc/dist/osprey_rpc-*.zip \
            osprey_rpc/dist/osprey_rpc-*.cdx.json
