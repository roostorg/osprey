name: Build and Publish Osprey Coordinator Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "osprey_coordinator/**"
      - "proto/**"
      - ".github/workflows/publish-coordinator-image.yml"
      - ".github/actions/install-trivy/**"
  pull_request:
    branches:
      - main
    paths:
      - "osprey_coordinator/**"
      - "proto/**"
      - ".github/workflows/publish-coordinator-image.yml"
      - ".github/actions/install-trivy/**"
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/osprey-coordinator
  # Fall back to GHCR if the default mirror.gcr.io Trivy DB mirror is unavailable.
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write  # to upload Trivy SARIF results to code scanning
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./osprey_coordinator/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # PR builds aren't pushed, so load them into the local daemon for Trivy to scan.
          load: ${{ github.event_name == 'pull_request' }}
          # Registry SBOM and provenance attestations; the docker exporter used by
          # `load` can't store them, so PR builds skip them.
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install Trivy
        uses: ./.github/actions/install-trivy

      # Non-blocking: findings are triaged in code scanning, and a scanner or DB
      # outage must not fail a job whose image is already pushed.
      - name: Scan image with Trivy
        continue-on-error: true
        env:
          IMAGE_REF: >-
            ${{ github.event_name == 'pull_request'
              && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, steps.meta.outputs.version)
              || format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.build.outputs.digest) }}
        # Results go only to the SARIF file, not the public job log.
        run: >-
          "$RUNNER_TEMP/trivy-bin/trivy" image --quiet --scanners vuln --pkg-types os,library
          --format sarif --output trivy-coordinator.sarif "$IMAGE_REF"

      # Code scanning alerts are visible only to people with write access. PR
      # runs skip the upload because PR alerts surface as public annotations.
      - name: Upload Trivy results to code scanning
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: trivy-coordinator.sarif
          category: trivy-osprey-coordinator-${{ github.event_name == 'release' && 'release' || 'edge' }}

      - name: Generate build summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** $REGISTRY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** $IMAGE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$TAGS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Attach CycloneDX SBOMs to the GitHub Release. The image SBOM covers the OS
  # packages; the coordinator binary isn't built with cargo-auditable and the
  # image drops the source, so the crate list comes from Cargo.lock instead.
  attach-sboms:
    if: github.event_name == 'release'
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to upload release assets
      packages: read  # to pull the image from GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: ./.github/actions/install-trivy

      - name: Generate SBOMs
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          TAG: ${{ github.event.release.tag_name }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/trivy-bin/trivy" image --quiet --format cyclonedx \
            --output "osprey-coordinator-${TAG}.cdx.json" "$IMAGE_REF"
          "$RUNNER_TEMP/trivy-bin/trivy" fs --quiet --format cyclonedx \
            --output "osprey-coordinator-crates-${TAG}.cdx.json" osprey_coordinator

      - name: Upload SBOMs to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --clobber \
            "osprey-coordinator-${TAG}.cdx.json" \
            "osprey-coordinator-crates-${TAG}.cdx.json"
