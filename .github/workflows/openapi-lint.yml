name: OpenAPI Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/api/**"
      - "osprey_worker/src/osprey/worker/ui_api/**"
      - ".github/workflows/openapi-lint.yml"
  push:
    branches: [main]
    paths:
      - "docs/api/**"
      - "osprey_worker/src/osprey/worker/ui_api/**"
      - ".github/workflows/openapi-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openapi-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.22"

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@2.71.0 lint --config docs/api/redocly.yaml docs/api/openapi.yaml
